services:
  central:
    build:
      context: .
      dockerfile: src/app/backend/central/Dockerfile
    container_name: central
    ports:
      - "8000:8000"
    environment:
      - EPSILON=${EPSILON:-8.0}
      - BASE_DIR=/app
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
    networks:
      - federated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hospital_0:
    build:
      context: .
      dockerfile: src/app/backend/hospital/Dockerfile
    container_name: hospital_0
    ports:
      - "8100:8100"
    environment:
      - HOSPITAL_ID=0
      - EPSILON=${EPSILON:-8.0}
      - BASE_DIR=/app
      - HOSPITAL_PASSWORD=${HOSPITAL_0_PASSWORD:-hospital}
      - JWT_SECRET=${JWT_SECRET:-secret}
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
      - ./notes:/app/notes
    depends_on:
      central:
        condition: service_healthy
    networks:
      - federated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/categories"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

