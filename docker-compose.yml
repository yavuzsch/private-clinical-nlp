services:
  central:
    build:
      context: .
      dockerfile: src/app/backend/central/Dockerfile
    container_name: central
    ports:
      - "8000:8000"
    environment:
      - EPSILON=${EPSILON:-8.0}
      - BASE_DIR=/app
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
    networks:
      - federated

  hospital_0:
    build:
      context: .
      dockerfile: src/app/backend/hospital/Dockerfile
    container_name: hospital_0
